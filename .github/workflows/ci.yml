name: ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # No database, no Redis, no Docker: the application factory means the
      # tests supply their own settings and never open a connection (DD-01).
      - run: pytest -q

  frontend-build:
    name: frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The production build is the frontend's only automated check, and it
      # catches what `next dev` tolerates.
      - run: npm run build
