name: ci

on:
  push:
  pull_request:

# Item 11, step 12: each action at its current major's newest release that
# is at least two weeks old and runs on Node 24 (read 27 October 2026):
# checkout v7.0.1 (20 July), setup-python v7.0.0 (20 July; v7.1.0 of
# 22 October is too new), setup-node v7.1.0 (8 October). Exact tags, so a
# newer release is never taken unread. The runner pinned, not "latest".

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # No database, no Redis, no Docker: the application factory means the
      # tests supply their own settings and never open a connection (DD-01).
      - run: pytest

  frontend-build:
    name: frontend production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The pure parts: a trace into nodes and edges, the layout, and the
      # guard that every request goes through lib/api.ts (IR-16). No
      # browser and no server.
      - run: npm test
      # The production build catches what `next dev` tolerates.
      - run: npm run build
