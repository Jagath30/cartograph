name: cartograph

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${APP_DB_NAME:?set APP_DB_NAME in .env}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:?set WAREHOUSE_DB_NAME in .env}
      WAREHOUSE_RO_USER: ${WAREHOUSE_RO_USER:?set WAREHOUSE_RO_USER in .env}
      WAREHOUSE_RO_PASSWORD: ${WAREHOUSE_RO_PASSWORD:?set WAREHOUSE_RO_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      APP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${APP_DB_NAME}
      WAREHOUSE_DATABASE_URL: postgresql://${WAREHOUSE_RO_USER}:${WAREHOUSE_RO_PASSWORD}@postgres:5432/${WAREHOUSE_DB_NAME}
      REDIS_URL: redis://redis:6379/0
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      # Read by the browser, so it must be an address the host can reach --
      # not the compose service name.
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

volumes:
  pgdata:
