naming:
  prefixes:
    cc_:  call center
    cp_:  catalog page
    cr_:  catalog returns
    cs_:  catalog sales
    c_:   customer
    ca_:  customer address
    cd_:  customer demographics
    d_:   date
    hd_:  household demographics
    ib_:  income band
    inv_: inventory
    i_:   item
    p_:   promotion
    r_:   reason
    sm_:  ship mode
    s_:   store
    sr_:  store returns
    ss_:  store sales
    t_:   time
    w_:   warehouse
    wp_:  web page
    wr_:  web returns
    ws_:  web sales
    web_: web site

  words:
    # keys
    sk:       surrogate key
    id:       identifier
    addr:     address
    cdemo:    customer demographics
    hdemo:    household demographics
    promo:    promotion
    cust:     customer
    # money and measures
    ext:      extended
    amt:      amount
    inc:      including
    sq:       square
    ft:       feet
    # the calendar
    moy:      month of year
    qoy:      quarter of year
    dom:      day of month
    dow:      day of week
    fy:       fiscal
    ly:       last year
    lq:       last quarter
    seq:      sequence
    gmt:      GMT
    # everything else
    rec:      record
    desc:     description
    mkt:      market
    dep:      dependent
    manufact: manufacturer
    dmail:    direct mail
    tv:       television
    ad:       advertisement
    char:     character
    autogen:  automatically generated
    shipto:   ship-to
    dim:      dimension

preferences:
  - attach_to:   store_sales
    rather_than: store_returns
    because: >-
      Operator default. A return refers to its sale, so a table either
      could carry is taken to describe the sale.
  - attach_to:   catalog_sales
    rather_than: catalog_returns
    because: >-
      Operator default. A return refers to its sale, so a table either
      could carry is taken to describe the sale.
  - attach_to:   web_sales
    rather_than: web_returns
    because: >-
      Operator default. A return refers to its sale, so a table either
      could carry is taken to describe the sale.
  - between: [catalog_sales, date_dim]
    prefer:
      - from: catalog_sales.cs_sold_date_sk
        to:   date_dim.d_date_sk
    because: >-
      Operator default. A question that names no date means the date of
      sale.
  - between: [web_sales, date_dim]
    prefer:
      - from: web_sales.ws_sold_date_sk
        to:   date_dim.d_date_sk
    because: >-
      Operator default. A question that names no date means the date of
      sale.
