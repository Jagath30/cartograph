# Relationships of the TPC-DS warehouse that nothing declares (FR-43).
#
# WRITTEN BY HAND, and the only place they are edited. tpcds_ri.sql, the
# TPC's own constraint file, supplies 102 relationships and omits these
# five. The generator copies the entries below, unchanged, into tpcds.yaml
# after the 102 -- which is what the application reads. After any edit here:
#
#     python3 backend/warehouse/ri.py write-overlay
#
# and a test fails until you do.
#
# These are assertions by a person, not declarations by the database. The
# database holds no constraint for any of them, so each reaches the graph as
# `source: overlay`, and each carries a note saying what it rests on. The
# notes differ because the evidence differs. Nothing goes in this file that
# the data contradicts: a false relationship here would make the system
# confidently wrong.
#
# from / to   one table.column, or a list of them for a key of several
#             columns -- the same number on each side, paired by position.
# note        why it is asserted. Optional to the parser; not optional here.
#
# All measurements: 8 October 2026, scale factor 1, read as the SELECT-only
# role. Not re-measured at any other scale factor.

relationships:
  - from: customer.c_last_review_date_sk
    to:   date_dim.d_date_sk
    note: >-
      Not in tpcds_ri.sql. Rests on the data: 96,516 non-null values in
      100,000 rows, 366 distinct, one contiguous year resolving to
      2002-01-08 through 2003-01-08, and every one of them is a d_date_sk.
      Zero violations. The column is integer where d_date_sk is bigint.

  - from: web_page.wp_customer_sk
    to:   customer.c_customer_sk
    note: >-
      Not in tpcds_ri.sql. Rests on the column name and the TPC-DS
      specification, NOT on the data. Only 21 of 60 rows are non-null. All
      21 match a customer, but they could not have failed to: every integer
      from 1 to 100,000 is a valid c_customer_sk, so these rows cannot tell
      a real reference from a coincidence.

  - from: [store_returns.sr_item_sk, store_returns.sr_ticket_number]
    to:   [store_sales.ss_item_sk, store_sales.ss_ticket_number]
    note: >-
      Not in tpcds_ri.sql, and not declarable as a constraint here: no fact
      table has a primary key. Rests on the data: the pair (ss_item_sk,
      ss_ticket_number) is unique and never null across 2,880,404 sales,
      and all 287,867 returns match exactly one sale. Zero violations. The
      returns-side pair is unique too, so a sale has at most one return.

  - from: [catalog_returns.cr_item_sk, catalog_returns.cr_order_number]
    to:   [catalog_sales.cs_item_sk, catalog_sales.cs_order_number]
    note: >-
      Not in tpcds_ri.sql, and not declarable as a constraint here: no fact
      table has a primary key. Rests on the data: the pair (cs_item_sk,
      cs_order_number) is unique and never null across 1,441,548 sales,
      and all 144,067 returns match exactly one sale. Zero violations. The
      returns-side pair is unique too, so a sale has at most one return.

  - from: [web_returns.wr_item_sk, web_returns.wr_order_number]
    to:   [web_sales.ws_item_sk, web_sales.ws_order_number]
    note: >-
      Not in tpcds_ri.sql, and not declarable as a constraint here: no fact
      table has a primary key. Rests on the data: the pair (ws_item_sk,
      ws_order_number) is unique and never null across 719,384 sales, and
      all 71,654 returns match exactly one sale. Zero violations. The
      returns-side pair is unique too, so a sale has at most one return.
