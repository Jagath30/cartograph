# Alembic: every change to the application store's schema (DR-14).
#
#     docker compose exec backend alembic upgrade head
#     docker compose exec backend alembic downgrade -1
#
# The database URL is NOT here. migrations/env.py reads APP_DATABASE_URL from
# the environment, so no credential is ever written to a tracked file (NFR-09).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
